# https://docs.expo.dev/guides/monorepos/
nodeLinker: hoisted

publishBranch: main

packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

patchedDependencies:
  react-native-reanimated@4.7.1: patches/react-native-reanimated@4.7.1.patch

minimumReleaseAgeExclude:
